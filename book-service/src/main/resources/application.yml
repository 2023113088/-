server:
  port: 9002

spring:
  application:
    name: BOOK-SERVICE
  datasource:
    url: jdbc:h2:mem:bookdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  internal:
    api-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token-min-16-chars!!}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [book-service trace:%X{traceId:-}]"
