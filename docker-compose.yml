# 栈级隔离：固定 compose 项目名，避免与其它项目的 default 网络/卷冲突
name: library-cloud

# Docker 桥接网络：仅本 compose 内服务互通，与宿主机其它容器默认隔离（除非 join 同一网络）
networks:
  library-backend:
    name: library-cloud-backend
    driver: bridge

# PPT 架构：Nginx → Gateway → 微服务；Eureka + Config(Git)；入口 http://localhost:${NGINX_HOST_PORT:-18888}
# 全栈：MySQL + Eureka + Config Server + 业务服务 + Gateway + Nginx
# 密钥与端口：复制 env.example 为 .env 后按需修改；docker compose 会自动加载 .env 做变量替换
# docker compose up -d --build

services:
  mysql:
    image: mysql:8.0
    container_name: library-mysql
    networks:
      - library-backend
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_change_me}
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-authentication-plugin=mysql_native_password"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s

  eureka-server:
    build:
      context: .
      dockerfile: docker/eureka-server/Dockerfile
    container_name: library-eureka
    networks:
      - library-backend
    ports:
      - "${EUREKA_HOST_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s

  config-server:
    build:
      context: .
      dockerfile: docker/config-server/Dockerfile
    container_name: library-config
    networks:
      - library-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    ports:
      - "${CONFIG_SERVER_HOST_PORT:-8888}:8888"

  user-service:
    build:
      context: .
      dockerfile: docker/user-service/Dockerfile
    networks:
      - library-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-library}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-library_secret_change_me}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      APP_JWT_SECRET: ${APP_JWT_SECRET:-library-docker-jwt-secret-must-be-32bytes-min!!}
    ports:
      - "${USER_SERVICE_HOST_PORT:-9001}:9001"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_started

  book-service:
    build:
      context: .
      dockerfile: docker/book-service/Dockerfile
    networks:
      - library-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-library}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-library_secret_change_me}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-internal-service-token-min-16-chars!!}
    ports:
      - "${BOOK_SERVICE_HOST_PORT:-9002}:9002"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_started

  borrow-service:
    build:
      context: .
      dockerfile: docker/borrow-service/Dockerfile
    networks:
      - library-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-library}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-library_secret_change_me}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-internal-service-token-min-16-chars!!}
    ports:
      - "${BORROW_SERVICE_HOST_PORT:-9003}:9003"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_started
      book-service:
        condition: service_started

  gateway-service:
    build:
      context: .
      dockerfile: docker/gateway-service/Dockerfile
    container_name: library-gateway
    networks:
      - library-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      APP_JWT_SECRET: ${APP_JWT_SECRET:-library-docker-jwt-secret-must-be-32bytes-min!!}
    ports:
      - "${GATEWAY_HOST_PORT:-18080}:18080"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_started
      user-service:
        condition: service_started
      book-service:
        condition: service_started
      borrow-service:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: library-nginx
    networks:
      - library-backend
    ports:
      - "${NGINX_HOST_PORT:-18888}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway-service:
        condition: service_started

volumes:
  mysql_data:
    name: library-cloud-mysql-data
