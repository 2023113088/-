server:
  port: 9003

spring:
  application:
    name: BORROW-SERVICE
  datasource:
    url: jdbc:h2:mem:borrowdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [borrow-service trace:%X{traceId:-}]"

app:
  internal:
    api-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token-min-16-chars!!}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 8
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
    instances:
      BOOK-SERVICE:
        baseConfig: default
